<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="1200" height="420" rx="3" fill="#0D1117"/>

  <style>
    .label {
      fill: #58A6FF;
      font-family: 'Segoe UI', Ubuntu, Sans-Serif;
      font-weight: 600;
      font-size: 13px;
    }

    .grid {
      stroke: #58A6FF;
      stroke-width: 1;
      stroke-opacity: 0.3;
      stroke-dasharray: 2 2;
    }

    /*
      STATIC DOTS
    */
    .point {
      stroke: #58A6FF;
      stroke-width: 10;
      stroke-linecap: round;
    }

    /*
      ANIMATED LINE ONLY
    */
    .line {
      fill: none;
      stroke: #1F6FEB;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 5000;
      stroke-dashoffset: 5000;
      animation: draw 5s ease-in-out infinite;
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 5000;
      }

      50% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: -5000;
      }
    }
  </style>

